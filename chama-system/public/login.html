<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chama Manager - Login</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* your CSS stays unchanged (already good) */
    </style>
  </head>

  <body>
    <div class="login-container">
      <div class="header-section">
        <div class="logo-glow">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 6c1.66 0 3 1.34 3 3 0 1.09-.58 2.04-1.46 2.56L15 17H9l1.46-4.44C9.58 12.04 9 11.09 9 10c0-1.66 1.34-3 3-3zm0 2c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"
            />
          </svg>
        </div>

        <h2>Chama Login</h2>
        <p class="subtitle">Securely access your Chama account</p>
      </div>

      <form id="loginForm">
        <div class="input-group">
          <input
            type="text"
            id="phone"
            placeholder="Phone Number"
            required
            autocomplete="tel"
          />
        </div>

        <div class="input-group">
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
            autocomplete="current-password"
          />
        </div>

        <button type="submit" id="loginBtn">Login</button>
      </form>

      <p class="footer-text">
        Don't have an account? <a href="#">Register here</a>
      </p>
    </div>

    <!-- Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/login.js"></script>
  </body>
</html>
